[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "B008",   # Do not perform function call `Depends` in argument defaults (FastAPI design)
    "BLE001", # Do not catch blind exception (resilient fallback design)
    "E501",   # Line too long
    "F403",   # from module import *
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
