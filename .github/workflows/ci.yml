name: VentureLens CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend Lint & Pytest
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'backend/requirements.txt'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install ruff pytest pytest-asyncio httpx aiofiles

    - name: Lint (Ruff)
      run: |
        cd backend
        ruff check app

    - name: Run Tests (Pytest)
      run: |
        cd backend
        export PYTHONPATH=.
        pytest tests/
      env:
        DATABASE_URL: sqlite+aiosqlite:///./test.db
        SECRET_KEY: test_secret_ci_key

  frontend-test:
    name: Frontend Lint & Next.js Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Lint (ESLint)
      run: |
        cd frontend
        npm run lint

    - name: Build (Next.js Production)
      run: |
        cd frontend
        npm run build

  docker-build:
    name: Docker Container Build Verification
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Backend Docker Image
      run: |
        cd backend
        docker build -t venturelens-api:latest .

    - name: Build Frontend Docker Image
      run: |
        cd frontend
        docker build -t venturelens-web:latest .
